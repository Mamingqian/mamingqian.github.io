# Site settings
name: Mingqian Ma
email: mamingqian@gmail.com
url: "https://mamingqian.github.io"

# Each publication in _posts/ gets its own page at /publications/<file-name>/
permalink: /publications/:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge

sass:
  style: :compressed

plugins:
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - _make_thumbnails.sh
  - vendor
  - .bundle
